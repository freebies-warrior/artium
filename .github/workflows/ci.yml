name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      agents: ${{ steps.filter.outputs.agents }}
      ci-workflow: ${{ steps.filter.outputs.ci-workflow }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'apps/frontend/**'
            backend:
              - 'apps/backend/**'
            agents:
              - 'apps/agents/**'
            ci-workflow:
              - '.github/workflows/ci.yml'

  frontend-ci:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci-workflow == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: apps/frontend
        run: npm test
      - name: Build frontend
        working-directory: apps/frontend
        run: npm run build
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build frontend Docker image
        working-directory: apps/frontend
        run: docker build .

  backend-ci:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci-workflow == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'
      - name: Install backend dependencies
        working-directory: apps/backend
        run: go mod download
      - name: Run backend tests
        working-directory: apps/backend
        run: go test ./... -cover -coverprofile=coverage.out -tags=unit
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend Docker image
        working-directory: apps/backend
        run: docker build .

  agents-ci:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.agents == 'true' || needs.changes.outputs.ci-workflow == 'true'
    defaults:
      run:
        working-directory: apps/agents
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: 'apps/agents/uv.lock'
      - name: Install agents dependencies
        run: uv sync --locked --dev
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Run agents tests
        run: uv run python -m coverage run -m pytest -q --disable-warnings
