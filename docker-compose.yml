services:
  postgres:
    image: postgres:16
    container_name: artium-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: artium
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d artium"]
      interval: 5s
      timeout: 3s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: artium-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      args:
        MAIN_PKG: .
        BIN_NAME: server
    env_file:
      - ./apps/backend/.env
    environment:
      PORT: "8080"
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/artium?sslmode=disable"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  pgadmin_data:
