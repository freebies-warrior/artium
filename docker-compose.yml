services:
  postgres:
    image: postgres:16
    container_name: artium-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: artium
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d artium"]
      interval: 5s
      timeout: 3s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: artium-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      args:
        MAIN_PKG: .
        BIN_NAME: server
    env_file:
      - ./apps/backend/.env
    environment:
      PORT: "8080"
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/artium?sslmode=disable"
      BACKEND_BASE_URL: "http://backend:8080"
      APP_BASE_URL: "http://localhost:3000"
      AI_BASE_URL: "http://agents:8000"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    env_file:
      - ./apps/frontend/.env
    environment:
      BACKEND_URL: "http://backend:8080"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
      - /app/.next

  mailpit:
    image: axllent/mailpit:latest
    container_name: artium-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"  # Web UI
      - "1025:1025"  # SMTP


volumes:
  pgdata:
  pgadmin_data:
